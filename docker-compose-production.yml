services:
  deer-radio-mysql:
    container_name: deer-radio-mysql
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - deer-radio-mysql-data:/var/lib/mysql
    networks:
      - deer-radio-network
    healthcheck:
        test: out=$$(mysqladmin ping -h 127.0.0.1 -u $DB_USERNAME --password=$DB_PASSWORD 2>&1); echo $$out | grep 'mysqld is alive' || { echo $$out; exit 1; }
        interval: 5s
        timeout: 5s
        retries: 55
    restart: unless-stopped

  deer-radio-php-fpm:
    container_name: deer-radio-php-fpm
    build:
      context: ./
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        - "USER_UID=${USER_UID:-1000}"
        - "USER_GID=${USER_GID:-1000}"
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - deer-radio-app:/var/www/app
      - deer-radio-storage:/var/radio-storage
    networks:
      - deer-radio-network
    depends_on:
      deer-radio-mysql:
          condition: service_healthy
    healthcheck:
        test: php artisan db:show | grep -c "deer-radio-mysql" > /dev/null
        interval: 5s
        timeout: 5s
        retries: 55
    restart: unless-stopped

  deer-radio-nginx:
    container_name: deer-radio-nginx
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - '80:80'
      - '443:443'
    labels:
      - "sh.acme.autoload.domain=${APP_HOST}"
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - deer-radio-app:/var/www/app
      - deer-radio-certs:/etc/ssl/certs/deer-radio
      - deer-radio-storage:/var/radio-storage
    networks:
      - deer-radio-network
    depends_on:
      deer-radio-php-fpm:
          condition: service_healthy
      deer-radio-mysql:
          condition: service_healthy
    healthcheck:
        test: [ "CMD", "curl", "--fail", "http://localhost"]
        interval: 10s
        timeout: 1s
        retries: 30
    restart: unless-stopped

  acme.sh:
    image: neilpang/acme.sh
    container_name: acme.sh
    command: daemon
    volumes:
      - deer-radio-app:/var/www/app
      - deer-radio-acme:/acme.sh
      - /run/user/${USER_UID:-1000}/docker.sock:/var/run/docker.sock
    environment:
      - DEPLOY_DOCKER_CONTAINER_LABEL=sh.acme.autoload.domain=${APP_HOST}
      - DEPLOY_DOCKER_CONTAINER_KEY_FILE=/etc/ssl/certs/deer-radio/privkey.pem
      - DEPLOY_DOCKER_CONTAINER_CERT_FILE="/etc/ssl/certs/deer-radio/cert.pem"
      - DEPLOY_DOCKER_CONTAINER_CA_FILE="/etc/ssl/certs/deer-radio/ca.pem"
      - DEPLOY_DOCKER_CONTAINER_FULLCHAIN_FILE="/etc/ssl/certs/deer-radio/fullchain.pem"
      - DEPLOY_DOCKER_CONTAINER_RELOAD_CMD="nginx -s reload"
    depends_on:
      deer-radio-nginx:
        condition: service_healthy

  deer-radio-liquidsoap:
      container_name: deer-radio-liquidsoap
      build:
          context: ./
          dockerfile: ./docker/liquidsoap/Dockerfile
          args:
            - "USER_UID=${USER_UID:-1000}"
            - "USER_GID=${USER_GID:-1000}"
      logging:
        driver: "local"
        options:
          max-size: "10m"
          max-file: "10"
      volumes:
          - deer-radio-liquidsoap:/var/liquidsoap/radio
          - deer-radio-storage:/var/radio-storage
      networks:
          - deer-radio-network
      depends_on:
          deer-radio-php-fpm:
              condition: service_healthy
          deer-radio-nginx:
              condition: service_healthy
      healthcheck:
          test: curl -sS http://deer-radio-liquidsoap:8080/api/healthcheck | grep -c '"status":"ok"' > /dev/null
          interval: 5s
          timeout: 5s
          retries: 55
      restart: unless-stopped
# 0 Tyson's addition

networks:
  deer-radio-network:
    driver: bridge

volumes:
  deer-radio-app:
    driver: local
  deer-radio-certs:
    driver: local
  deer-radio-acme:
    driver: local
  deer-radio-mysql-data:
    driver: local
  deer-radio-storage:
    driver: local
  deer-radio-liquidsoap:
    driver: local
# 000000 Tyson's touch
